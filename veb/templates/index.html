<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Распределение — спецмат</title>
<style>
:root{
  --bg:#fbfaf6; --panel:#fffdf8; --text:#211f1b; --muted:#726c60;
  --rule:#e7e2d6; --accent:#2f6e8e; --accent-soft:#e8f0f4; --warm:#c9743a;
  --faint:#b7ae9c; --chip:#e7e0d2;
  --sans:"Source Sans 3",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1e22; --panel:#23272c; --text:#dcd8d0; --muted:#9a948a;
  --rule:#343a41; --accent:#7fb6d2; --accent-soft:#22333d; --warm:#e0946a;
  --faint:#6b6f75; --chip:#333a41;
}}
:root[data-theme="dark"]{
  --bg:#1b1e22; --panel:#23272c; --text:#dcd8d0; --muted:#9a948a;
  --rule:#343a41; --accent:#7fb6d2; --accent-soft:#22333d; --warm:#e0946a;
  --faint:#6b6f75; --chip:#333a41;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--serif);font-size:20px}

/* ── выезжающая панель: устройство взято из lenta-derevya/view.html ── */
.panel-bok{position:fixed;left:0;top:0;height:100vh;width:320px;z-index:50;overflow:auto;
  background:var(--panel);border-right:1px solid var(--rule);padding:5rem 1.4rem 2rem;
  transform:translateX(-100%);transition:transform .18s ease,box-shadow .18s ease;
  font-family:var(--sans)}
.panel-bok.open{transform:none;box-shadow:0 0 26px rgba(0,0,0,.28)}
.burger{position:fixed;left:14px;top:14px;z-index:60;width:44px;height:40px;
  background:var(--panel);border:1px solid var(--rule);border-radius:8px;cursor:pointer;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px}
.burger span{display:block;width:20px;height:2px;background:var(--text);border-radius:2px}
.burger:hover{border-color:var(--accent)}
.panel-bok a{display:block;color:var(--muted);text-decoration:none;padding:.5em .6em;
  border-radius:6px;font-size:19px}
.panel-bok a:hover{color:var(--accent);background:var(--accent-soft)}
.panel-bok .zag{font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);margin:1.4rem 0 .5rem;padding-bottom:.4em;border-bottom:1px solid var(--rule)}

/* Текст занимает ВСЁ пространство. Сдвигается вправо, только когда панель открыта. */
.holst{padding:5rem 3rem 4rem;transition:padding-left .18s ease;max-width:none}
.holst.sdvinut{padding-left:22rem}

h1{font-family:var(--sans);font-size:2.6rem;font-weight:600;letter-spacing:-.02em;margin:0 0 .1em}
.data{color:var(--muted);font-family:var(--sans);font-size:1rem;margin:0 0 2rem}

/* ── вкладки: скрытые radio + label, без JS ── */
.tabs>input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.tabbar{display:flex;gap:.3rem;border-bottom:2px solid var(--rule);margin:0 0 2rem}
.tabbar label{cursor:pointer;user-select:none;font-family:var(--sans);font-weight:600;
  font-size:1.25rem;color:var(--muted);padding:.55rem 1.4rem;border:2px solid transparent;
  border-bottom:none;border-radius:10px 10px 0 0;margin-bottom:-2px}
.tabbar label:hover{color:var(--text)}
.vid{display:none}
#t-shk:checked~#v-shk{display:block}
#t-prp:checked~#v-prp{display:block}
#t-shk:checked~.tabbar label[for=t-shk],
#t-prp:checked~.tabbar label[for=t-prp]{color:var(--accent);background:var(--panel);
  border-color:var(--rule) var(--rule) var(--panel)}

.poisk{width:100%;max-width:640px;padding:.7em .9em;font:inherit;font-size:1.2rem;
  border:1px solid var(--rule);border-radius:9px;background:var(--panel);color:var(--text);
  margin:0 0 1.6rem}
.poisk:focus{outline:none;border-color:var(--accent)}

table{border-collapse:collapse;width:100%;font-size:1.15rem}
th{font-family:var(--sans);font-size:.85rem;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint);text-align:left;padding:0 1.2rem .6rem 0;
  border-bottom:1px solid var(--rule)}
td{padding:.75rem 1.2rem .75rem 0;border-bottom:1px solid var(--rule);vertical-align:baseline}
tr:hover td{background:var(--accent-soft)}
.fam{font-weight:600}
.klass{color:var(--muted);font-family:var(--sans);font-size:.95rem}
.kab{font-family:var(--sans);font-weight:600;background:var(--chip);border-radius:7px;
  padding:.15em .6em;white-space:nowrap}
.ruk{color:var(--muted);font-family:var(--sans);font-size:.95rem}
.net{color:var(--warm);font-family:var(--sans);font-size:1rem}
.gruppa{margin:0 0 2.6rem}
.gruppa h2{font-family:var(--sans);font-size:1.7rem;font-weight:600;margin:0 0 .1em}
.gruppa .pod{color:var(--muted);font-family:var(--sans);font-size:1rem;margin:0 0 .8rem}
.gruppa ul{list-style:none;margin:0;padding:0;columns:2;column-gap:3rem}
.gruppa li{padding:.35em 0;border-bottom:1px solid var(--rule);break-inside:avoid;font-size:1.15rem}
select{font:inherit;font-size:1rem;padding:.3em;background:var(--panel);color:var(--text);
  border:1px solid var(--rule);border-radius:6px}
@media (max-width:760px){
  .holst{padding:5rem 1.2rem 3rem}
  .holst.sdvinut{padding-left:1.2rem}
  .gruppa ul{columns:1}
}
</style>

<button class="burger" id="burger" aria-label="меню"><span></span><span></span><span></span></button>

<nav class="panel-bok" id="panel">
  <div class="zag">Спецмат</div>
  <a href="/">Главная</a>
  <a href="/raspredelenie">Распределение</a>
  <a href="/listki">Листки 9 класса</a>
  <div class="zag">Ещё</div>
  <a href="/urovni">Три уровня</a>
  <a href="/listki-8">Листки 8 класса</a>
</nav>

<main class="holst" id="holst">
  <h1>Распределение</h1>
  <p class="data" id="data"></p>

  <div class="tabs">
    <input type="radio" name="vid" id="t-shk" checked>
    <input type="radio" name="vid" id="t-prp">
    <div class="tabbar">
      <label for="t-shk">Школьнику</label>
      <label for="t-prp">Преподавателю</label>
    </div>

    <section class="vid" id="v-shk">
      <input class="poisk" id="poisk" placeholder="Фамилия" autocomplete="off">
      <table>
        <thead><tr><th>Школьник</th><th>Принимает</th><th>Кабинет</th></tr></thead>
        <tbody id="telo-shk"></tbody>
      </table>
    </section>

    <section class="vid" id="v-prp"><div id="telo-prp"></div></section>
  </div>
</main>

<script>
const burger = document.getElementById('burger');
const panel  = document.getElementById('panel');
const holst  = document.getElementById('holst');
burger.addEventListener('click', () => {
  panel.classList.toggle('open');
  holst.classList.toggle('sdvinut');
});

let dannye = null, organizator = false;

function ekran(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function risuyShkolnikov(filtr){
  const telo = document.getElementById('telo-shk');
  const f = (filtr || '').trim().toLowerCase();
  const spisok = dannye.students.filter(s => !f || s.surname.toLowerCase().startsWith(f));
  telo.innerHTML = spisok.map(s => {
    const prep = s.teacher_name
      ? (organizator ? vybor(s) : ekran(s.teacher_name))
      : '<span class="net">не назначен</span>';
    const kab = s.room
      ? '<span class="kab">' + ekran(s.room) + '</span>' +
        (s.rukovoditel ? ' <span class="ruk">' + ekran(s.rukovoditel) + '</span>' : '')
      : '<span class="net">—</span>';
    return '<tr><td><span class="fam">' + ekran(s.surname) + '</span> ' + ekran(s.name) +
           ' <span class="klass">' + ekran(s.class || '') + '</span></td>' +
           '<td>' + prep + '</td><td>' + kab + '</td></tr>';
  }).join('');
}

function vybor(s){
  const opts = dannye.teachers.map(t =>
    '<option value="' + t.teacher_id + '"' + (t.teacher_id === s.teacher_id ? ' selected' : '') +
    '>' + ekran(t.name) + '</option>').join('');
  return '<select data-student="' + s.student_id + '">' + opts + '</select>';
}

function risuyPrepodavatelej(){
  const telo = document.getElementById('telo-prp');
  telo.innerHTML = dannye.teachers.filter(t => t.load > 0).map(t =>
    '<div class="gruppa"><h2>' + ekran(t.name) + '</h2>' +
    '<p class="pod">' + (t.kabinet ? '<span class="kab">' + ekran(t.kabinet) + '</span>' : '') +
    (t.rukovoditel ? ' <span class="ruk">' + ekran(t.rukovoditel) + '</span>' : '') + '</p>' +
    '<ul>' + t.students.map(s =>
      '<li><span class="fam">' + ekran(s.surname) + '</span> ' + ekran(s.name) + '</li>').join('') +
    '</ul></div>').join('');
}

document.getElementById('poisk').addEventListener('input', e => risuyShkolnikov(e.target.value));

document.addEventListener('change', async e => {
  const sel = e.target.closest('select[data-student]');
  if (!sel) return;
  const otvet = await fetch('/api/enrollment', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({student_id:+sel.dataset.student, teacher_id:+sel.value, slot: dannye.slot})
  });
  if (otvet.ok) zagruzi(); else sel.style.borderColor = 'var(--warm)';
});

async function zagruzi(){
  const r = await fetch('/api/view?slot=1');
  dannye = await r.json();
  organizator = document.cookie.includes('spetsmat_veb');
  document.getElementById('data').textContent =
    'на ' + new Date().toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
  risuyShkolnikov(document.getElementById('poisk').value);
  risuyPrepodavatelej();
}
zagruzi();
</script>
