# A DISK FILLED BY LOGS LEFT AT DEBUG LEVEL AFTER A DEBUGGING SESSION is the failure this
# file exists for; it is on the owner's measured list.  The database of fifty-six students
# is under a megabyte, so nothing else on this machine can fill a disk -- but a journal at
# debug level fills the last gigabyte in hours, and a full disk makes SQLite return errors
# that look exactly like corruption.
#
# Installed by deploy/ustanovka.sh as /etc/systemd/journald.conf.d/spetsmat.conf.

[Journal]
SystemMaxUse=500M
SystemKeepFree=1G
MaxRetentionSec=1month
