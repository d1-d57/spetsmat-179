<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Листки 9 класса</title>
<link rel="stylesheet" href="/static/vhod.css">
<style>
  :root { --ink: #1a1714; --paper: #f2ede2; --rule: #d8cfbe;
          --muted: #8a8075; --accent: #a8502a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 15px/1.4 -apple-system, "Helvetica Neue", sans-serif;
         color: var(--ink); background: var(--paper);
         padding: 24px 32px; max-width: 720px; }
  header { display: flex; align-items: baseline; justify-content: space-between;
           border-bottom: 1px solid var(--rule); padding-bottom: 12px;
           margin-bottom: 18px; }
  h1 { font-size: 26px; font-weight: 500; }
  h2 { font-size: 11px; font-weight: 600; letter-spacing: 0.18em;
       text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  .sheet { border: 1px solid var(--rule); padding: 12px 14px; border-radius: 2px;
           margin-bottom: 10px; }
  .sheet .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .sheet .num { font-size: 20px; font-weight: 500; }
  .sheet .ver { color: var(--muted); font-size: 13px; }
  .sheet .dl { color: var(--accent); font-size: 14px; margin-top: 4px; }
  .sheet a { color: var(--ink); }
  details { margin-top: 14px; }
  summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  .empty { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<header>
  <h1>Листки 9 класса</h1>
  <a href="/glavnaya" style="color:var(--muted);font-size:14px;">← на главную</a>
</header>

<section class="sheet">
  <div class="head">
    <span class="num">16</span>
    <span class="ver">Деревья · одна версия на диске</span>
  </div>
  <div class="dl">Сдать лучше к 10 сентября, дедлайн мягкий ·
      <a href="/static/listki/16-derevya.pdf">PDF</a></div>
</section>

<h2>Прошлые листки этого года</h2>
<p class="empty">Пока ни одного — первый листок вышел 2 сентября.</p>

</body>
</html>
